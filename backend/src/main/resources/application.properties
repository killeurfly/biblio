spring.application.name=biblio
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblio}
spring.datasource.username=${DB_USER:biblio}
spring.datasource.password=${DB_PASSWORD:biblio}
# Le schéma est créé par init.sql : Hibernate vérifie seulement qu'il correspond aux entités
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true